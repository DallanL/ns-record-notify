# Every call routed through this system gets the announcement. Selection happens
# upstream at the NetSapiens dial rule: calls that should not be announced are
# simply not routed through this box.
#
# Reload without restarting: POST /api/reload  (or send SIGHUP to the controller).

announcement:
  # Master switch. true = announce on every call routed through this box. Set false
  # to pass calls through untouched -- for example to check a new trunk carries
  # audio cleanly before announcing -- then reload (POST /api/reload).
  enabled: true

  # Media to play. `sound:` paths resolve under Asterisk's sounds directories;
  # files in asterisk/sounds/ land in custom/.
  media: sound:custom/recording-notice

  # Seconds between the START of one playback and the start of the next.
  # If the prompt is longer than this, the next play is skipped rather than
  # overlapping itself.
  # Overridden by ANNOUNCE_INTERVAL_SECONDS in .env when that is set.
  interval_seconds: 30

  # Wait this long after the call is answered before the first playback, so the
  # announcement does not collide with the callee's "hello".
  # Overridden by ANNOUNCE_INITIAL_DELAY_SECONDS in .env when that is set.
  initial_delay_seconds: 3

  # Safety valve: stop announcing after this long even if nobody hits stop.
  # Set to 0 to keep going until the call ends or an operator stops it.
  max_duration_seconds: 0

dtmf_stop:
  # Digits someone on the call can press to stop the announcement for the rest
  # of that call. Leave empty ("") to disable the feature entirely.
  #
  # Use two digits rather than one. Whatever you choose still travels to the far
  # end -- this box observes DTMF, it cannot swallow it -- so a lone "*" or "0"
  # risks being pressed at a far-end IVR and silently killing the announcement.
  # Overridden by DTMF_STOP_DIGITS in .env when that is set (including empty,
  # which disables the feature).
  digits: "*9"

  # Who is allowed to press it:
  #   caller - the internal NetSapiens-side user only
  #   callee - the far party only
  #   any    - either side (default)
  # Consider "caller" if the announcement is a compliance notice you do not want
  # the outside party able to switch off.
  # Overridden by DTMF_ACCEPT_FROM in .env when that is set.
  accept_from: any

  # A partial sequence is forgotten after this many seconds of no digits.
  sequence_timeout_seconds: 5

safety:
  # Destinations that must never be announced over, even though everything
  # routed here is otherwise in scope. Standard emergency numbers are enforced
  # in code as well (see rules.js) -- this list is for site-specific additions
  # such as an internal safety or security line.
  # Supports `*` and `?` globs.
  exclude_dialed:
    - "911"
    - "1911"
    - "+1911"
