; AMI is not used by this box: the controller drives Asterisk over ARI, which is
; a separate interface on the HTTP server. Left at the distro default this is
; enabled on 127.0.0.1:5038 with no users, which is harmless right up until
; something drops a file into manager.d/ -- so it is disabled outright, and the
; stock '#include manager.d/*.conf' is deliberately not carried over.
[general]
enabled = no
