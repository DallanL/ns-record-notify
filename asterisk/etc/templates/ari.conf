[general]
enabled = yes
pretty = no
; Events are consumed over the WebSocket with subscribeAll=true, which is how the
; controller sees channels created by the dialplan Dial() rather than by Stasis.
;
; No allowed_origins. The only client is the controller, which is a Node process
; using ws -- not a browser, so it sends no Origin header and needs no CORS grant.
; A wildcard here would let any page the operator happens to open reach ARI on
; loopback and read the responses, with only the ARI password in the way.

[${ARI_USER}]
type = user
read_only = no
password = ${ARI_PASS}
password_format = plain
