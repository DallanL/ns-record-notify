; ---------------------------------------------------------------------------
; Two trunks: NetSapiens (calls arrive) and the carrier (calls depart).
; This box is a B2BUA sitting between them for OUTBOUND calls only.
;
; Every object gets a UNIQUE section name. Reusing one name for the endpoint,
; identify and aor causes Asterisk's config parser to merge the sections and
; silently drop objects -- notably the identify, which would leave inbound
; INVITEs from NetSapiens unmatched and rejected.
; ---------------------------------------------------------------------------

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = ${EXTERNAL_IP}
external_signaling_address = ${EXTERNAL_IP}
local_net = ${LOCAL_NET}

; ---------------------------- NetSapiens (calls arrive from here) ----------

[netsapiens]
type = endpoint
context = from-ns
transport = transport-udp
disallow = all
; Keep the codec list narrow and matched end-to-end so ordinary calls pass
; through without transcoding. Announcement playback transcodes only the
; affected call.
allow = ulaw
allow = alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
; Trust NetSapiens' P-Asserted-Identity -- announcement targeting reads the
; originating extension out of it.
trust_id_inbound = yes

[netsapiens-identify]
type = identify
endpoint = netsapiens
; NS_SIP_HOST may be a comma-separated list if the platform has several cores
; that can send us calls. All of them must be listed or their INVITEs are
; rejected as unidentified.
match = ${NS_SIP_HOST}

; ---------------------------- Carrier (calls depart to here) ---------------

[carrier]
type = endpoint
context = from-carrier
transport = transport-udp
disallow = all
allow = ulaw
allow = alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
aors = carrier-aor
from_domain = ${CARRIER_SIP_HOST}
; Uncommented by the entrypoint when CARRIER_USER/CARRIER_PASS are supplied.
;outbound_auth = carrier-auth

[carrier-identify]
type = identify
endpoint = carrier
match = ${CARRIER_SIP_HOST}

[carrier-aor]
type = aor
contact = sip:${CARRIER_SIP_HOST}:${CARRIER_SIP_PORT}
qualify_frequency = 60
