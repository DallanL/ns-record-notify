; ---------------------------------------------------------------------------
; Two trunks: NetSapiens (calls arrive) and the carrier (calls depart).
; This box is a B2BUA sitting between them for OUTBOUND calls only.
;
; Every object gets a UNIQUE section name. Reusing one name for the endpoint,
; identify and aor causes Asterisk's config parser to merge the sections and
; silently drop objects -- notably the identify, which would leave inbound
; INVITEs from NetSapiens unmatched and rejected.
; ---------------------------------------------------------------------------

; Transports are emitted by the entrypoint -- see emit_transports() there. A
; deployment where the two trunks leave by different interfaces (e.g. NetSapiens
; over a WireGuard tunnel, the carrier over the local WAN) needs one transport
; per path, because external_media_address is a per-transport setting.

; ---------------------------- NetSapiens (calls arrive from here) ----------

[netsapiens]
type = endpoint
context = from-ns
transport = ${NS_TRANSPORT}
disallow = all
; Keep the codec list narrow and matched end-to-end so ordinary calls pass
; through without transcoding. Announcement playback transcodes only the
; affected call.
allow = ulaw
allow = alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
; Trust NetSapiens' P-Asserted-Identity -- announcement targeting reads the
; originating extension out of it.
trust_id_inbound = yes
; Uncommented by the entrypoint when NS_AUTH_USER/NS_AUTH_PASS are supplied.
;auth = netsapiens-auth
;aors = netsapiens-aor

; The netsapiens-identify-N and carrier-identify-N objects are appended by the
; entrypoint -- one per host, see the comment there for why they are not a
; single comma-separated match.

; ---------------------------- Carrier (calls depart to here) ---------------
;
; The carrier may publish several gateways for failover, so there is one
; endpoint PER gateway (carrier-1, carrier-2, ...), generated by the entrypoint
; from CARRIER_SIP_HOST, each inheriting everything below.
;
; They are separate endpoints rather than several contacts on one AOR because
; dialling an endpoint whose AOR has multiple contacts FORKS to all of them at
; once -- the destination phone would ring once per gateway. Failover has to be
; sequential, which the dialplan does by trying carrier-1, then carrier-2, ...

[carrier-base](!)
type = endpoint
context = from-carrier
transport = ${CARRIER_TRANSPORT}
disallow = all
allow = ulaw
allow = alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
; Uncommented by the entrypoint when CARRIER_USER/CARRIER_PASS are supplied.
;outbound_auth = carrier-auth

; ---------------------------- SIP timers -----------------------------------
;
; Timer B is how long an INVITE waits for ANY response before the gateway is
; declared dead. The default is 32 seconds, which is what a caller would sit in
; silence for if a gateway drops packets without saying so -- long enough for
; the calling PBX to give up first. Asterisk requires B >= 64 x T1, so the
; entrypoint derives T1 from CARRIER_RESPONSE_TIMEOUT_MS rather than setting B alone. OPTIONS qualification usually marks a dead
; gateway unavailable before a call ever reaches it; this covers the window
; between the gateway dying and the next qualify.
[system]
type = system
timer_t1 = ${CARRIER_SIP_T1_MS}
timer_b = ${CARRIER_SIP_TIMER_B_MS}
