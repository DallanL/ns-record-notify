; ---------------------------------------------------------------------------
; Outbound-only. Calls arrive from NetSapiens and leave to the carrier.
;
; The Stasis() hop exists purely so the controller can inspect the call and
; decide whether it should be announced. The actual bridging is a plain Dial(),
; which keeps early media, DTMF and CDR answer-times behaving exactly as they
; do without this box in the path.
;
; If the controller is down, Stasis() sets STASISSTATUS=FAILED and falls through
; to the next priority -- the Dial(). Outbound calling keeps working, just
; without announcements.
; ---------------------------------------------------------------------------

[general]
static = yes
writeprotect = yes
clearglobalvars = no

[globals]
DIAL_TIMEOUT = 120
; MAX_CONCURRENT_CALLS and MAX_CONCURRENT_PER_CALLER are written into this
; included file by the entrypoint, from the environment. Included rather than
; templated so extensions.conf itself never passes through envsubst, which would
; happily eat dialplan variables like ${EXTEN}.
#include "globals.conf"

[from-ns]
; Accept both bare digits and +E.164. Stash the destination before the Goto,
; since Goto overwrites ${EXTEN}.
exten => _X.,1,Set(DEST=${EXTEN})
	same => n,Goto(outbound,1)

exten => _+X.,1,Set(DEST=${EXTEN})
	same => n,Goto(outbound,1)

; Emergency destinations, matched as literal extensions so they beat the _X.
; pattern above. They route straight to the carrier: no concurrency cap (a fraud
; brake must never be what stops a 911 call) and no Stasis hop (the controller
; already refuses to announce these, so the round trip buys nothing and can only
; add delay). Keep this list in step with EMERGENCY in controller/src/rules.js.
; DEST is stashed BEFORE the Goto, for the same reason as the patterns above:
; Goto overwrites ${EXTEN}, so reading it inside [emergency] would dial the
; literal string "emergency" at the carrier instead of the emergency number.
exten => 911,1,Set(DEST=${EXTEN})
	same => n,Goto(emergency,1)
exten => 1911,1,Set(DEST=${EXTEN})
	same => n,Goto(emergency,1)
exten => +1911,1,Set(DEST=${EXTEN})
	same => n,Goto(emergency,1)
exten => 933,1,Set(DEST=${EXTEN})
	same => n,Goto(emergency,1)
exten => 112,1,Set(DEST=${EXTEN})
	same => n,Goto(emergency,1)
exten => 999,1,Set(DEST=${EXTEN})
	same => n,Goto(emergency,1)
exten => 000,1,Set(DEST=${EXTEN})
	same => n,Goto(emergency,1)

exten => emergency,1,NoOp(EMERGENCY ${CALLERID(num)} -> ${DEST} -- caps and announcement bypassed)
	same => n,Gosub(capture-identity,s,1)
	same => n,Goto(dial,1)

exten => outbound,1,NoOp(Outbound ${CALLERID(num)} -> ${DEST})
	same => n,Gosub(capture-identity,s,1)
	same => n,Gosub(concurrency-guard,s,1)
	same => n,Stasis(announcer,classify)
	same => n,NoOp(Stasis returned ${STASISSTATUS} -- proceeding to dial)
	same => n,Goto(dial,1)

; ---------------------------------------------------------------------------
; Carrier failover. The carrier publishes several gateways; carrier-1 is tried
; first and carrier-2, carrier-3... only if the previous one FAILED.
;
; "Failed" means DIALSTATUS is in CARRIER_FAILOVER_ON -- by default CONGESTION
; (the gateway answered 503, i.e. busy or overloaded) and CHANUNAVAIL (it is
; down, unqualified, or never responded). Anything else is a real outcome and
; ends the call: ANSWER obviously, but also BUSY (the CALLEE is busy -- trying
; another gateway would just ring the same person again), NOANSWER, and CANCEL
; (the caller hung up).
;
; A gateway that is down but not yet noticed by qualification is abandoned after
; CARRIER_RESPONSE_TIMEOUT_MS instead of the 32 seconds SIP would otherwise wait.
; ---------------------------------------------------------------------------
exten => dial,1,Set(CARRIER_TRY=1)
	same => n(try),NoOp(Dialling ${DEST} via carrier-${CARRIER_TRY} of ${CARRIER_COUNT})
	same => n,Dial(PJSIP/${DEST}@carrier-${CARRIER_TRY},${DIAL_TIMEOUT},b(carrier-headers^s^1))
	same => n,NoOp(carrier-${CARRIER_TRY} returned ${DIALSTATUS} (cause ${HANGUPCAUSE}))
	; Not a gateway failure: this is the real outcome of the call.
	same => n,GotoIf($[${FIELDNUM(CARRIER_FAILOVER_ON,-,${DIALSTATUS})} = 0]?done)
	; Failure, but that was the last gateway.
	same => n,GotoIf($[${CARRIER_TRY} >= ${CARRIER_COUNT}]?exhausted)
	same => n,Set(CARRIER_TRY=$[${CARRIER_TRY} + 1])
	same => n,NoOp(FAILOVER to carrier-${CARRIER_TRY} after ${DIALSTATUS})
	same => n,Goto(try)
	; Every gateway failed. Tell the calling PBX with a 503 (cause 42) so it treats
	; this as a route failure and can try its own backup route. Left to itself a
	; CHANUNAVAIL hangs up with cause 3, which reaches the caller as a 404 -- a
	; PERMANENT failure that a well-behaved PBX will not retry anywhere.
	same => n(exhausted),NoOp(ALL ${CARRIER_COUNT} CARRIER GATEWAYS FAILED for ${DEST} -- last status ${DIALSTATUS})
	same => n,Hangup(42)
	same => n(done),Hangup()

exten => h,1,NoOp(Outbound call ended: ${DIALSTATUS})

; ---------------------------------------------------------------------------
; Read the originating identity once, while the INVITE headers are still
; available. NS_* are read back by the controller over ARI for the operator UI.
;
; The __H_* pair are the headers that must survive this B2BUA hop. Asterisk does
; NOT relay these on its own -- without this, the carrier receives an unsigned
; call with no asserted identity. '__' makes them inherit onto the outbound
; channel, where the pre-dial handler re-adds them.
; ---------------------------------------------------------------------------
[capture-identity]
exten => s,1,Set(NS_PAI=${PJSIP_HEADER(read,P-Asserted-Identity)})
	same => n,Set(NS_FROM=${PJSIP_HEADER(read,From)})
	same => n,Set(NS_DEST=${DEST})
	same => n,Set(__H_IDENTITY=${PJSIP_HEADER(read,Identity)})
	same => n,Set(__H_PAI=${PJSIP_HEADER(read,P-Asserted-Identity)})
	same => n,Set(__H_PPI=${PJSIP_HEADER(read,P-Preferred-Identity)})
	same => n,Set(__H_DIVERSION=${PJSIP_HEADER(read,Diversion)})
	same => n,Set(__H_RPID=${PJSIP_HEADER(read,Remote-Party-ID)})
	same => n,Set(__H_CHARGE=${PJSIP_HEADER(read,P-Charge-Info)})
	same => n,Return()

; ---------------------------------------------------------------------------
; Toll-fraud brake. Deliberately placed BEFORE Stasis() so it still applies when
; the controller is down -- the whole point is to bound the damage during the
; window where nobody is watching.
;
; GROUP_COUNT includes the channel we just added, so the test is '>' against the
; limit rather than '>='. Either limit set to 0 disables that check.
;
; Hangup(42) is switching-equipment-congestion, which PJSIP renders as a 503.
; NetSapiens treats that as a route failure and can fall to its backup route,
; where a 403 would look like a permanent rejection of the call itself.
; ---------------------------------------------------------------------------
[concurrency-guard]
exten => s,1,Set(GROUP()=outbound)
	; An empty caller ID would otherwise collapse every anonymous call into one
	; unnamed group and trip the per-caller limit on the second one.
	same => n,Set(CALLER_KEY=${IF($["${CALLERID(num)}" != ""]?${CALLERID(num)}:unknown)})
	same => n,Set(GROUP(caller)=${CALLER_KEY})
	same => n,ExecIf($[${MAX_CONCURRENT_CALLS} > 0 & ${GROUP_COUNT(outbound)} > ${MAX_CONCURRENT_CALLS}]?Goto(over-total,1))
	same => n,ExecIf($[${MAX_CONCURRENT_PER_CALLER} > 0 & ${GROUP_COUNT(${CALLER_KEY}@caller)} > ${MAX_CONCURRENT_PER_CALLER}]?Goto(over-caller,1))
	same => n,Return()

exten => over-total,1,NoOp(REJECTED ${CALLER_KEY} -> ${DEST}: ${GROUP_COUNT(outbound)} concurrent calls exceeds MAX_CONCURRENT_CALLS=${MAX_CONCURRENT_CALLS})
	same => n,Hangup(42)

exten => over-caller,1,NoOp(REJECTED ${CALLER_KEY} -> ${DEST}: ${GROUP_COUNT(${CALLER_KEY}@caller)} concurrent calls from this caller exceeds MAX_CONCURRENT_PER_CALLER=${MAX_CONCURRENT_PER_CALLER})
	same => n,Hangup(42)

; ---------------------------------------------------------------------------
; Pre-dial handler: runs on the OUTBOUND channel just before the INVITE goes to
; the carrier, which is the only place PJSIP_HEADER(add,...) affects that leg.
;
; Relays inbound identity verbatim rather than regenerating it. In particular
; the STIR/SHAKEN 'Identity' header must be byte-identical or its signature no
; longer verifies -- a regenerated header would be worse than none.
;
; To relay additional carrier-specific headers, capture them as __H_* in
; [from-ns] above and add a matching line here.
; ---------------------------------------------------------------------------
[carrier-headers]
exten => s,1,NoOp(Relaying identity headers to carrier)
	same => n,ExecIf($["${H_IDENTITY}" != ""]?Set(PJSIP_HEADER(add,Identity)=${H_IDENTITY}))
	same => n,ExecIf($["${H_PAI}" != ""]?Set(PJSIP_HEADER(add,P-Asserted-Identity)=${H_PAI}))
	same => n,ExecIf($["${H_PPI}" != ""]?Set(PJSIP_HEADER(add,P-Preferred-Identity)=${H_PPI}))
	same => n,ExecIf($["${H_DIVERSION}" != ""]?Set(PJSIP_HEADER(add,Diversion)=${H_DIVERSION}))
	same => n,ExecIf($["${H_RPID}" != ""]?Set(PJSIP_HEADER(add,Remote-Party-ID)=${H_RPID}))
	same => n,ExecIf($["${H_CHARGE}" != ""]?Set(PJSIP_HEADER(add,P-Charge-Info)=${H_CHARGE}))
	same => n,Return()

[from-carrier]
; Inbound is not in scope for this box -- NetSapiens keeps its own inbound path.
; Anything arriving here is unexpected, so reject it loudly rather than silently.
; '_X.' rather than '_.' -- a bare '_.' also swallows the special h/i/t
; extensions, which Asterisk warns about.
exten => _X.,1,Goto(reject,1)
exten => _+X.,1,Goto(reject,1)

exten => reject,1,NoOp(UNEXPECTED inbound call from carrier -- rejecting)
	same => n,Hangup(21)
