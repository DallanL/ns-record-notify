[directories](!)
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
; Sounds are searched under <astdatadir>/sounds. On this distro that is
; /usr/share/asterisk, NOT /var/lib/asterisk -- pointing it at the latter makes
; every custom prompt silently unresolvable.
astdatadir => /usr/share/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk

[options]
documentation_language = en_US
; Log to stdout so `docker compose logs` is the single place to look.
verbose = 3
