; The (!) that used to be on [directories] made this a TEMPLATE section, which
; meant Asterisk never applied a single line of it -- the paths only ever
; matched because the distro package happened to compile in the same defaults.
; It is a real section now, so these values are load-bearing. Check them against
; 'core show settings' after any change to the build.
[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
; Sounds are searched under <astdatadir>/sounds, and a source build puts its
; data -- core sounds AND the XML documentation -- in /var/lib/asterisk. Point
; this at /usr/share/asterisk (where the Debian/Ubuntu packages put it) and
; Asterisk cannot find its documentation and refuses to start at all, while a
; merely mismatched sounds path is worse: every call sounds healthy and the
; prompt is silently unresolvable.
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk

[options]
documentation_language = en_US
; Log to stdout so `docker compose logs` is the single place to look.
verbose = 3
