[modules]
autoload = yes

; This box does one job: relay outbound SIP and inject an announcement.
;
; Most of what used to be listed here is gone. Building from source lets us
; simply not build unwanted modules (see the menuselect step in the Dockerfile),
; and Asterisk 22 removed a number of others outright -- chan_sip, chan_skinny,
; chan_mgcp, app_macro and the rest. A noload for a module that does not exist
; is silently ignored, so a stale list looks protective while doing nothing.
;
; What remains is modules that ARE built and that we actively do not want.
; Re-check this against `ls /usr/lib/asterisk/modules` after a version bump.

; Analogue display services and CPE provisioning -- long deprecated, unused.
noload => res_adsi.so
noload => app_adsiprog.so
noload => app_getcpeid.so

; Config backends. Everything here is static files, and res_config_ldap in
; particular has carried an unauthenticated filter-injection flaw.
noload => res_config_ldap.so
noload => res_config_sqlite3.so

; CDR/CEL writers. NetSapiens is the system of record for call detail; this box
; keeping its own copy adds disk writes and a second, disagreeing source of
; truth. cdr_custom and cel_custom also decline to load without their own config
; files, which is the ERROR they emit at startup.
noload => cdr_custom.so
noload => cel_custom.so
noload => cdr_sqlite3_custom.so
noload => cel_sqlite3_custom.so

; Alternative dialplan language support -- we use extensions.conf only.
noload => res_ael_share.so

; Stats exporter, unused.
noload => res_statsd.so
