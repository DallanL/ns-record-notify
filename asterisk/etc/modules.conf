[modules]
autoload = yes

; This box does one job: relay outbound SIP and inject an announcement. Anything
; not needed for that is unloaded -- it removes a large amount of startup config
; noise and keeps the attack surface small.

; Legacy channel drivers, superseded by chan_pjsip.
noload => chan_sip.so
noload => chan_iax2.so
noload => chan_unistim.so
noload => chan_skinny.so
noload => chan_mgcp.so

; Deprecated, slated for removal upstream.
noload => res_adsi.so
noload => app_adsiprog.so
noload => app_getcpeid.so

; Voicemail lives on NetSapiens. Loading both app_voicemail and the IMAP
; variant also causes duplicate-application registration warnings.
noload => app_voicemail.so
noload => app_voicemail_imap.so
noload => cel_tds.so

; Realtime / database backends -- all config here is static files.
noload => res_odbc.so
noload => res_config_odbc.so
noload => res_config_pgsql.so
noload => res_config_ldap.so
noload => res_config_sqlite3.so
noload => cdr_odbc.so
noload => cdr_pgsql.so
noload => cel_odbc.so
noload => cel_pgsql.so
; These depend on res_odbc above and fail to link without it.
noload => func_odbc.so
noload => res_odbc_transaction.so
noload => app_voicemail_odbc.so
noload => cdr_adaptive_odbc.so
noload => cdr_sqlite3_custom.so
noload => cel_sqlite3_custom.so
noload => cdr_tds.so
noload => cdr_radius.so
noload => cel_radius.so

; Deprecated dialplan application, replaced by GoSub.
noload => app_macro.so

; Alternative dialplan languages -- we use extensions.conf only.
noload => pbx_ael.so
noload => pbx_lua.so
noload => res_ael_share.so

; Peer-to-peer number discovery, unused.
noload => pbx_dundi.so

; Packet capture / stats exporters, unused.
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
noload => res_statsd.so

; PJSIP features not used by a two-trunk B2BUA.
noload => res_pjsip_config_wizard.so
noload => res_pjsip_geolocation.so
noload => res_geolocation.so
noload => res_pjsip_phoneprov_provider.so
noload => res_phoneprov.so

; No local sound hardware in a container.
noload => chan_alsa.so
noload => chan_console.so
noload => chan_oss.so

; Music on hold is the PBX's job, not this relay's.
noload => res_musiconhold.so
