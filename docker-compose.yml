# Docker keeps container logs forever by default. On a public address SIP scanners
# generate a steady stream of "failed request" lines, and on a small VM that alone
# can fill the disk. Bounded rotation costs nothing.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  asterisk:
    build: ./asterisk
    container_name: ns-announce-asterisk
    restart: unless-stopped
    logging: *logging
    # Ceilings, not reservations: a runaway process (or a flood of calls) hits
    # these instead of taking the whole VM down with it. Generous on purpose --
    # Asterisk is thread-heavy, and starving it of pids breaks calls.
    mem_limit: 2g
    pids_limit: 2048
    # Host networking is deliberate. SIP/RTP through Docker's bridge NAT and
    # userland proxy adds jitter and breaks SDP address rewriting, and a 10k-port
    # RTP range would have to be published. With host networking this performs
    # essentially like bare metal.
    network_mode: host
    # Host networking means the container shares the host's network namespace,
    # so a container escape is a host compromise -- there is no network boundary
    # left to slow it down. These cost nothing here: Asterisk already runs as a
    # non-root user and binds only ports above 1024 (5060 and the RTP range), so
    # it needs no capabilities at all.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env
    volumes:
      # Must be under Asterisk's data directory, which is where <astdatadir>/sounds
      # is searched. For our source build that is /var/lib/asterisk -- the distro
      # package used /usr/share/asterisk, so this path changed with the upgrade.
      - ./asterisk/sounds:/var/lib/asterisk/sounds/custom:ro
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  controller:
    build: ./controller
    container_name: ns-announce-controller
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    pids_limit: 256
    # The controller writes nothing at runtime, so its filesystem can be read-only:
    # a compromised process cannot drop a payload where it would survive a restart.
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      - asterisk
    # Also host networking, so it can reach ARI on 127.0.0.1. ARI is bound to
    # loopback and must not be exposed off-box.
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env
    environment:
      ARI_URL: http://127.0.0.1:${ARI_PORT:-8088}
      RULES_PATH: /config/rules.yaml
      # Bound to loopback by default. Put a reverse proxy with auth in front
      # before setting this to 0.0.0.0.
      WEB_HOST: ${WEB_HOST:-127.0.0.1}
    volumes:
      - ./config:/config:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.WEB_PORT||8080)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
